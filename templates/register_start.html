{% extends "base.html" %}
{% block main %}
  <section class="card">
    <h2>Continue to register</h2>
    <p class="muted">Event: {{ event.event_name }}</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('register_start') }}" class="form one-col">
      <label for="student_id">Your SSC roll no <span class="required">*</span></label>
      <input type="text" id="student_id" name="student_id" required
             autocomplete="off" placeholder="e.g. 2022015" pattern="[0-9]+" title="Numbers only"
             value="{{ request.form.student_id or '' }}">
      <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-arrow-right"></i> Continue</button>
    </form>
  </section>
{% endblock %}
