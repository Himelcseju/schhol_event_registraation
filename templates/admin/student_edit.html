{% extends "admin/base.html" %}
{% block main %}
  <section class="card">
    <h2>Edit Student</h2>
    <p class="muted">Roll: {{ student.student_id }} (cannot change)</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('admin_student_edit', student_id=student.id) }}" class="form one-col">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" required value="{{ student.full_name }}">
      <label for="nickname">Nickname</label>
      <input type="text" id="nickname" name="nickname" value="{{ student.nickname or '' }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ student.email or '' }}">
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" value="{{ student.phone or '' }}">
      <label for="baria_address">B. Baria address</label>
      <input type="text" id="baria_address" name="baria_address" value="{{ student.baria_address or '' }}">
      <label for="current_address">Current Address</label>
      <input type="text" id="current_address" name="current_address" value="{{ student.current_address or '' }}">
      <label for="profession">Profession</label>
      <input type="text" id="profession" name="profession" value="{{ student.profession or '' }}">
      <label for="organization_name">Organization Name</label>
      <input type="text" id="organization_name" name="organization_name" value="{{ student.organization_name or '' }}">
      <label for="blood_group">Blood Group</label>
      <input type="text" id="blood_group" name="blood_group" value="{{ student.blood_group or '' }}" maxlength="5">
      <label for="batch_id">Batch</label>
      <select id="batch_id" name="batch_id">
        <option value="">—</option>
        {% for b in batches %}
        <option value="{{ b.id }}" {% if student.batch_id == b.id %}selected{% endif %}>{{ b.batch_name }}</option>
        {% endfor %}
      </select>
      <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-floppy-disk"></i> Save</button>
    </form>
    <p><a href="{{ url_for('admin_students') }}" class="link-back">← Back to Students</a></p>
  </section>
{% endblock %}
